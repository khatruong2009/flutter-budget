# XcodeGen spec for the native Budgie app (MIGRATION_SPEC 14.0 Q9).
# Regenerate with: cd native && xcodegen generate
# Identifiers must stay identical to the Flutter app (MIGRATION_SPEC section 2).
name: Budgie
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    DEVELOPMENT_TEAM: TJ37GFZKW2
    CODE_SIGN_STYLE: Automatic
    # Provisional (Q6): the build number must exceed the last App Store
    # Connect upload before any submission.
    MARKETING_VERSION: "4.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  BudgieCore:
    path: BudgieCore
targets:
  Budgie:
    type: application
    platform: iOS
    sources:
      - path: Budgie
    dependencies:
      - package: BudgieCore
      - target: BudgetWidgetsExtension
    entitlements:
      path: Budgie/Budgie.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.khatruong.budgetbuddy
    info:
      path: Budgie/Info.plist
      properties:
        CFBundleDisplayName: Budgie
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.finance
        LSRequiresIPhoneOS: true
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.khatruong.budgetbuddy
            CFBundleURLSchemes: [budgetapp]
        NSFaceIDUsageDescription: Budgie uses Face ID to protect your financial data when App Lock is enabled.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UILaunchScreen:
          UIColorName: launch-screen-background
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.khatruong.budgetbuddy
        PRODUCT_NAME: Budgie
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
  BudgetWidgetsExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: BudgetWidgets
    entitlements:
      path: BudgetWidgets/BudgetWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.khatruong.budgetbuddy
    info:
      path: BudgetWidgets/Info.plist
      properties:
        CFBundleDisplayName: Budget Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.khatruong.budgetbuddy.BudgetWidgetsExtension
        PRODUCT_NAME: BudgetWidgetsExtension
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
  BudgieAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BudgieAppTests
    dependencies:
      - target: Budgie
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.khatruong.budgetbuddy.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Budgie.app/Budgie
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Budgie:
    build:
      targets:
        Budgie: all
        BudgieAppTests: [test]
    test:
      targets:
        - BudgieAppTests
